<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" style="font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif"><rect x="0" y="0" width="390" height="844" rx="0" fill="white" stroke="none"/><rect x="0" y="0" width="390" height="844" rx="0" fill="white" stroke="#ccc"/><text x="26" y="30" font-size="14" fill="#111" font-weight="600" text-anchor="start">9:41</text><rect x="140" y="12" width="110" height="28" rx="14" fill="#111" stroke="none"/><text x="360" y="29" font-size="11" fill="#111" font-weight="400" text-anchor="end">▮ ▮  ▰</text><text x="24" y="78" font-size="22" fill="#222" font-weight="700" text-anchor="start">Transparency.</text><path d="M0 98L390 98" stroke="#d1d1d1" fill="none"/><svg x="0" y="100" width="390" height="650" viewBox="0 0 390 650" overflow="hidden"><text x="24" y="41" font-size="23" fill="#222" font-weight="600" text-anchor="start">가릴 것이 없으니까.</text><text x="24" y="68" font-size="12" fill="#777" font-weight="400" text-anchor="start">성분부터 사용법까지, Transparency.</text><text x="24" y="120" font-size="12" fill="#555" font-weight="400" text-anchor="start">이메일</text><rect x="24" y="132" width="342" height="45" rx="3" fill="#f7f7f7" stroke="#ccc"/><text x="38" y="160" font-size="13" fill="#999" font-weight="400" text-anchor="start">example@email.com</text><text x="24" y="220" font-size="12" fill="#555" font-weight="400" text-anchor="start">비밀번호</text><rect x="24" y="232" width="342" height="45" rx="3" fill="#f7f7f7" stroke="#ccc"/><text x="38" y="260" font-size="13" fill="#999" font-weight="400" text-anchor="start">비밀번호 입력</text><text x="24" y="325" font-size="11" fill="#777" font-weight="400" text-anchor="start">이메일 또는 비밀번호를 확인해 주세요.</text><rect x="24" y="360" width="342" height="47" rx="3" fill="#333" stroke="#333"/><text x="195.0" y="388.5" font-size="14" fill="#fff" font-weight="500" text-anchor="middle">로그인 → 04 / 제품 링크가 있으면 07</text><text x="195" y="445" font-size="11" fill="#777" font-w