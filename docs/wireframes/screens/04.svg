<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" style="font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif"><rect x="0" y="0" width="390" height="844" rx="0" fill="white" stroke="none"/><rect x="0" y="0" width="390" height="844" rx="0" fill="white" stroke="#ccc"/><text x="26" y="30" font-size="14" fill="#111" font-weight="600" text-anchor="start">9:41</text><rect x="140" y="12" width="110" height="28" rx="14" fill="#111" stroke="none"/><text x="360" y="29" font-size="11" fill="#111" font-weight="400" text-anchor="end">▮ ▮  ▰</text><text x="24" y="78" font-size="22" fill="#222" font-weight="700" text-anchor="start">Transparency.</text><path d="M0 98L390 98" stroke="#d1d1d1" fill="none"/><svg x="0" y="100" width="390" height="650" viewBox="0 0 390 650" overflow="hidden"><rect x="0" y="0" width="390" height="250" rx="5" fill="#eee" stroke="#ccc"/><path d="M0 0L390 250" stroke="#d1d1d1" fill="none"/><path d="M390 0L0 250" stroke="#d1d1d1" fill="none"/><rect x="16" y="18" width="270" height="113" rx="0" fill="#ffffffed" stroke="none"/><text x="30" y="48" font-size="23" fill="#252525" font-weight="600" text-anchor="start">가릴 것이 없으니까.</text><text x="30" y="81" font-size="23" fill="#252525" font-weight="700" text-anchor="start">Transparency.</text><text x="30" y="109" font-size="12" fill="#252525" font-weight="400" text-anchor="start">극도의 투명함, 손안에서.</text><rect x="24" y="274" width="342" height="47" rx="3" fill="#fff" stroke="#bbb"/><text x="195.0" y="302.5" font-size="14" fill="#333" font-weight="500" text-anchor="middle">제품 검색 → 05</text><text x="24" y="365" font-size="18" fill="#252525" font-weight="600" text-anchor="start">사용 중인 제품</text><text x="366" y="365" font-size="11" fill="#777" font-weight="400" text-anchor="end">내 제품 → 13</text><rect x="24" y="385" width="82" height="94" rx="5" fill="#eee" stroke="#ccc"/><path d="M24 385L106 479" stroke="#d1d1d1" fill="none"/><path d="M106 385L24 479" stroke="#d1d1d