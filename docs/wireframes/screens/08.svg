chor="start">함량을 설정한 이유와 기준</text><text x="24" y="455" font-size="17" fill="#252525" font-weight="500" text-anchor="start">참고 출처</text><text x="24" y="508" font-size="14" fill="#252525" font-weight="400" text-anchor="start">자료 제목 · 발행기관</text><text x="366" y="508" font-size="12" fill="#777" font-weight="400" text-anchor="end">원문 →</text><path d="M24 529L366 529" stroke="#d1d1d1" fill="none"/><rect x="24" y="570" width="342" height="54" rx="0" fill="#f4f4f4" stroke="#c9c9c9"/><text x="38" y="602" font-size="11" fill="#777" font-weight="400" text-anchor="start">미공개 정보는 상태와 이유를 표시합니다.</text></svg><rect x="0" y="758" width="390" height="86" rx="0" fill="#fafafa" stroke="#ddd"/><rect x="41" y="774" width="16" height="16" rx="3" fill="#eee" stroke="#aaa"/><text x="49" y="810" font-size="10" fill="#999" font-weight="500" text-anchor="middle">홈</text><rect x="138" y="774" width="16" height="16" rx="3" fill="#aaa" stroke="#aaa"/><text x="146" y="810" font-size="10" fill="#222" font-weight="500" text-anchor="middle">제품 탐색</text><rect x="235" y="774" width="16" height="16" rx="3" fill="#eee" stroke="#aaa"/><text x="243" y="810" font-size="10" fill="#999" font-weight="500" text-anchor="middle">내 제품</text><rect x="332" y="774" width="16" height="16" rx="3" fill="#eee" stroke="#aaa"/><text x="340" y="810" font-size="10" fill="#999" font-weight="500" text-anchor="middle">더보기</text><rect x="135" y="832" width="120" height="4" rx="2" fill="#222" stroke="none"/></svg>