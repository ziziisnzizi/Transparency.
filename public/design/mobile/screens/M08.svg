<text x="38" y="376" fill="#717171" font-size="11" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">세럼 S.1의 보습 효과와 지속시간에 관한</text>
<text x="38" y="394" fill="#717171" font-size="11" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">완제품 시험 결과는 공개된 자료에 포함되지 않습니다.</text>
<text x="24" y="453" fill="#222222" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="text-before-edge">히알루론산 · 성분 연구</text>
<text x="24" y="487" fill="#717171" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">여성 76명을 대상으로 한 연구에서 히알루론산 0.1% 크림을</text>
<text x="24" y="508" fill="#717171" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="text-before-edge">60일간 사용했을 때 피부 수분과 탄력이 개선되었습니다.</text>
<text x="24" y="563" fill="#222222" font-size="11" font-weight="500" text-anchor="start" dominant-baseline="text-before-edge">참고 연구: Pavicic 외(2011)</text>
